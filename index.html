<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>얼굴 인식</title>
<style>
  :root {
    --bg: #eef1f4; --card: #ffffff; --ink: #172033; --sub: #5b667a;
    --line: #d9dee6; --ok: #0f9d58; --no: #d93025; --accent: #1f4fd8; --person: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
  body { padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 24px); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 14px 0 10px; }
  .cam { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; }
  .cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam video { transform: scaleX(-1); }
  .cam.back video { transform: none; }
  #status { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff;
    font-size: 12px; padding: 4px 8px; border-radius: 6px; }
  #flip { position: absolute; right: 8px; top: 8px; background: rgba(0,0,0,.55); color: #fff;
    border: 0; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin: 12px 0; }
  .tabs button { flex: 1; padding: 11px 0; border: 1px solid var(--line); background: var(--card);
    border-radius: 10px; font-size: 14px; color: var(--sub); }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .panel.on { display: block; }
  .face { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .face:last-child { border-bottom: 0; }
  .face .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-size: 24px; font-weight: 700; }
  .name.person { color: var(--person); font-weight: 600; }
  .pct { font-size: 34px; font-weight: 700; line-height: 1.1; color: var(--ok); }
  .verdict { font-size: 13px; font-weight: 600; }
  .ok { color: var(--ok); } .no { color: var(--no); } .mute { color: var(--sub); }
  .bar { height: 8px; background: #e6eaf0; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--ok); width: 0; }
  .row { display: flex; justify-content: space-between; font-size: 14px; }
  .small { font-size: 12px; color: var(--sub); }
  h2 { font-size: 14px; margin: 16px 0 6px; }
  input[type=text] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .btn { display: block; width: 100%; padding: 13px; font-size: 15px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; margin-top: 8px; text-align: center; }
  .btn.alt { background: #e6eaf0; color: var(--ink); }
  .btn:disabled { opacity: .4; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .item button { border: 0; background: none; color: var(--no); font-size: 14px; padding: 6px; }
  .log { font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  #prog { font-size: 13px; color: var(--sub); margin-top: 8px; min-height: 18px; }
  input[type=range] { width: 100%; }
</style>
</head>
<body>
<h1>얼굴 인식</h1>

<div class="cam" id="cam">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <button id="flip">카메라 전환</button>
  <div id="status">모델 불러오는 중…</div>
</div>

<div class="tabs">
  <button data-t="rec" class="on">인식</button>
  <button data-t="reg">등록</button>
  <button data-t="list">목록</button>
</div>

<!-- 인식 -->
<div class="panel on" id="rec">
  <div id="resEmpty" class="mute">카메라에 얼굴을 비춰주세요.</div>
  <div id="resBox"></div>
  <h2>인식 기록</h2>
  <div id="log"><div class="small">아직 기록이 없습니다.</div></div>
</div>

<!-- 등록 -->
<div class="panel" id="reg">
  <div class="small" id="regCount" style="margin-bottom:8px"></div>
  <input type="text" id="regName" placeholder="이름 입력" maxlength="20">
  <label class="btn" for="files">사진·동영상 올리기</label>
  <input type="file" id="files" accept="image/*,video/*" multiple style="display:none">
  <button class="btn alt" id="shot">현재 카메라로 촬영 추가</button>
  <div id="prog"></div>
  <div class="thumbs" id="thumbs"></div>
  <button class="btn" id="save" disabled>이 사람 저장</button>
  <button class="btn alt" id="reset">추가한 얼굴 비우기</button>
  <div class="small" style="margin-top:10px">한 사람당 정면 사진 3~10장, 또는 얼굴이 잘 나온 동영상 1개를 올리면 됩니다. 사진에 여러 명이 있으면 가장 큰 얼굴만 사용합니다. 추가된 얼굴 사진(작은 이미지)을 누르면 빼낼 수 있습니다.</div>
</div>

<!-- 목록 -->
<div class="panel" id="list">
  <div id="people"></div>
  <h2>일치 기준 (거리)</h2>
  <input type="range" id="thr" min="0.35" max="0.60" step="0.01">
  <div class="small" id="thrTxt"></div>
  <button class="btn alt" id="export">데이터 내보내기 (JSON)</button>
  <button class="btn alt" id="import">데이터 가져오기</button>
  <input type="file" id="file" accept="application/json" style="display:none">
  <div class="small" style="margin-top:10px">데이터는 이 휴대폰 브라우저에만 저장됩니다. 브라우저 데이터를 지우거나 시크릿 모드를 쓰면 사라지니, 발표 전에 내보내기로 백업해 두세요.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/";
const KEY = "faces_v1", KEY_THR = "faces_thr";
const MAX_PEOPLE = 30;       // 최대 등록 인원
const MAX_PER = 15;          // 1인당 보관하는 얼굴 샘플 수
const MAX_STAGE = 15;        // 한 번에 추가할 수 있는 얼굴 수
const $ = id => document.getElementById(id);

const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
let db = {};
try { db = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (_) { db = {}; }
let thr = parseFloat(localStorage.getItem(KEY_THR)) || 0.5;   // 이 거리 미만이면 일치 (작을수록 엄격)
let facing = "user", stream = null, busy = false, procBusy = false;
let staged = [];                 // [{desc:[...], thumb:dataURL}]
const lastSeen = {};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (_) { alert("저장 공간이 부족합니다. 불필요한 사람을 삭제하세요."); }
};

// 거리 → 일치율(%): 기준 거리에서 50%, 가까울수록 100%에 접근 (확률이 아닌 유사도 점수)
const toPct = d => 100 / (1 + Math.exp(10 * (d - thr)));

function rank(desc) {
  return Object.entries(db).map(([name, list]) => {
    const d = Math.min(...list.map(x => faceapi.euclideanDistance(desc, x)));
    return { name, d, pct: toPct(d) };
  }).sort((a, b) => a.d - b.d);
}

async function startCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
    });
  } catch (e) {
    $("status").textContent = "카메라 권한을 허용하고 HTTPS 주소로 접속하세요";
    return;
  }
  video.srcObject = stream;
  await video.play();
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  $("cam").style.aspectRatio = video.videoWidth + "/" + video.videoHeight;
  $("cam").classList.toggle("back", facing !== "user");
  $("status").textContent = "인식 중";
}

async function init() {
  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
    ]);
  } catch (e) {
    $("status").textContent = "모델 로드 실패: 인터넷 연결을 확인하세요";
    return;
  }
  await startCam();
  loop();
}

const liveOpts = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 });
const stillOpts = new faceapi.TinyFaceDetectorOptions({ inputSize: 608, scoreThreshold: 0.4 });

async function loop() {
  if (!busy && !procBusy && video.readyState >= 2 && video.videoWidth) {
    busy = true;
    try {
      const dets = await faceapi.detectAllFaces(video, liveOpts).withFaceLandmarks().withFaceDescriptors();
      render(dets);
    } catch (e) { /* 다음 프레임에서 재시도 */ }
    busy = false;
  }
  setTimeout(loop, 120);
}

// ---- 인식 화면 ----
function render(dets) {
  const W = overlay.width, H = overlay.height;
  ctx.clearRect(0, 0, W, H);
  const mirror = facing === "user";
  const hasDb = Object.keys(db).length > 0;
  const results = [];

  dets.forEach(det => {
    const b = det.detection.box;
    const top = hasDb ? rank(det.descriptor)[0] : null;
    const matched = !!top && top.d < thr;
    const x = mirror ? W - b.x - b.width : b.x;
    const color = matched ? "#0f9d58" : "#6b7280";
    ctx.lineWidth = Math.max(2, W / 200);
    ctx.strokeStyle = color;
    ctx.strokeRect(x, b.y, b.width, b.height);
    const label = matched ? top.name + " " + Math.round(top.pct) + "%" : "사람";
    ctx.font = "bold " + Math.round(W / 26) + "px sans-serif";
    const tw = ctx.measureText(label).width + 10, th = Math.round(W / 22);
    ctx.fillStyle = color;
    ctx.fillRect(x, Math.max(0, b.y - th), tw, th);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, x + 5, Math.max(th - 6, b.y - 6));
    results.push({ area: b.width * b.height, matched, top });
  });

  if (!results.length) {
    $("resEmpty").style.display = ""; $("resBox").innerHTML = "";
    return;
  }
  $("resEmpty").style.display = "none";
  results.sort((a, b) => b.area - a.area);
  $("resBox").innerHTML = results.slice(0, 5).map(r => r.matched
    ? '<div class="face"><div class="top"><span class="name">' + esc(r.top.name) + '</span>' +
      '<span class="pct">' + r.top.pct.toFixed(1) + '%</span></div>' +
      '<div class="bar"><i style="width:' + r.top.pct + '%"></i></div>' +
      '<div class="small"><span class="verdict ok">등록된 사람</span> · 거리 ' + r.top.d.toFixed(3) + ' (기준 ' + thr.toFixed(2) + ' 미만)</div></div>'
    : '<div class="face"><div class="top"><span class="name person">사람</span></div>' +
      '<div class="small">등록되지 않은 얼굴</div></div>').join("");

  const now = Date.now();
  results.forEach(r => {
    if (r.matched && now - (lastSeen[r.top.name] || 0) > 10000) addLog(r.top.name, r.top.pct);
    if (r.matched) lastSeen[r.top.name] = now;
  });
}

function addLog(name, pct) {
  const box = $("log");
  if (box.querySelector(".small")) box.innerHTML = "";
  const t = new Date().toLocaleTimeString("ko-KR", { hour12: false });
  const el = document.createElement("div");
  el.className = "log";
  el.innerHTML = "<span>" + esc(name) + " (" + pct.toFixed(1) + "%)</span><span class='mute'>" + t + "</span>";
  box.prepend(el);
  while (box.children.length > 8) box.lastChild.remove();
}

// ---- 등록: 사진/동영상/카메라 ----
const area = d => d.detection.box.width * d.detection.box.height;

function cropThumb(src, box) {
  const pad = 0.25, sw = src.videoWidth || src.width, sh = src.videoHeight || src.height;
  const x = Math.max(0, box.x - box.width * pad), y = Math.max(0, box.y - box.height * pad);
  const w = Math.min(sw - x, box.width * (1 + 2 * pad)), h = Math.min(sh - y, box.height * (1 + 2 * pad));
  const c = document.createElement("canvas"); c.width = 96; c.height = 96;
  c.getContext("2d").drawImage(src, x, y, w, h, 0, 0, 96, 96);
  return c.toDataURL("image/jpeg", 0.7);
}

function toCanvas(src, w, h, maxSide = 960) {
  const s = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return c;
}

// 캔버스에서 가장 큰 얼굴 1개 → {n, det}
async function bestFace(cv) {
  const dets = await faceapi.detectAllFaces(cv, stillOpts).withFaceLandmarks().withFaceDescriptors();
  if (!dets.length) return { n: 0 };
  dets.sort((a, b) => area(b) - area(a));
  return { n: dets.length, det: dets[0] };
}

function tryStage(det, srcCanvas) {
  if (det.detection.box.width < 60) return "small";            // 너무 작은 얼굴은 정확도가 낮음
  const desc = Array.from(det.descriptor);
  const minD = staged.length ? Math.min(...staged.map(s => faceapi.euclideanDistance(desc, s.desc))) : 1;
  if (minD < 0.12) return "dup";                                // 거의 같은 얼굴은 건너뜀
  staged.push({ desc, thumb: cropThumb(srcCanvas, det.detection.box) });
  return "ok";
}

async function fromImage(file, stat) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const cv = toCanvas(img, img.naturalWidth, img.naturalHeight);
    const r = await bestFace(cv);
    if (!r.n) { stat.none++; return; }
    if (r.n > 1) stat.multi++;
    const res = tryStage(r.det, cv);
    stat[res === "ok" ? "added" : res]++;
  } finally { URL.revokeObjectURL(url); }
}

function waitEvent(el, ev, ms) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error("timeout")), ms);
    el.addEventListener(ev, () => { clearTimeout(t); res(); }, { once: true });
  });
}

async function fromVideo(file, stat) {
  const url = URL.createObjectURL(file);
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
  try {
    await waitEvent(v, "loadeddata", 10000);
    const dur = v.duration;
    if (!isFinite(dur) || dur <= 0) throw new Error("duration");
    const n = Math.min(12, Math.max(2, Math.floor(dur / 0.6)));
    for (let i = 0; i < n && staged.length < MAX_STAGE; i++) {
      v.currentTime = Math.min(dur - 0.05, dur * (i + 0.5) / n);
      await waitEvent(v, "seeked", 6000);
      const cv = toCanvas(v, v.videoWidth, v.videoHeight);
      const r = await bestFace(cv);
      if (!r.n) { stat.none++; continue; }
      const res = tryStage(r.det, cv);
      stat[res === "ok" ? "added" : res]++;
    }
  } finally { URL.revokeObjectURL(url); v.removeAttribute("src"); v.load(); }
}

const isVideo = f => f.type.startsWith("video") || /\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name);

$("files").onchange = async e => {
  const files = Array.from(e.target.files); e.target.value = "";
  if (!files.length) return;
  if (!video.videoWidth && !faceapi.nets.faceRecognitionNet.isLoaded) { alert("모델이 아직 로드되지 않았습니다."); return; }
  procBusy = true;
  while (busy) await sleep(50);
  const stat = { added: 0, none: 0, small: 0, dup: 0, multi: 0, fail: 0 };
  for (let i = 0; i < files.length; i++) {
    if (staged.length >= MAX_STAGE) break;
    $("prog").textContent = "처리 중 (" + (i + 1) + "/" + files.length + ") " + files[i].name;
    try { isVideo(files[i]) ? await fromVideo(files[i], stat) : await fromImage(files[i], stat); }
    catch (_) { stat.fail++; }
    renderThumbs();
  }
  procBusy = false;
  const msg = ["얼굴 " + stat.added + "개 추가"];
  if (stat.none) msg.push("얼굴 없음 " + stat.none);
  if (stat.small) msg.push("너무 작음 " + stat.small);
  if (stat.dup) msg.push("중복 " + stat.dup);
  if (stat.multi) msg.push("여러 명 사진 " + stat.multi + "건(가장 큰 얼굴만 사용)");
  if (stat.fail) msg.push("읽기 실패 " + stat.fail);
  if (staged.length >= MAX_STAGE) msg.push("최대 " + MAX_STAGE + "개 도달");
  $("prog").textContent = msg.join(" / ");
};

$("shot").onclick = async () => {
  if (staged.length >= MAX_STAGE) { alert("한 번에 최대 " + MAX_STAGE + "개까지 추가할 수 있습니다."); return; }
  if (!video.videoWidth) { alert("카메라가 아직 준비되지 않았습니다."); return; }
  procBusy = true;
  while (busy) await sleep(50);
  try {
    const dets = await faceapi.detectAllFaces(video, liveOpts).withFaceLandmarks().withFaceDescriptors();
    if (dets.length !== 1) { alert("화면에 얼굴이 정확히 1명 보여야 합니다."); }
    else {
      const desc = Array.from(dets[0].descriptor);
      staged.push({ desc, thumb: cropThumb(video, dets[0].detection.box) });
      $("prog").textContent = "카메라 촬영 1개 추가";
    }
  } catch (_) { alert("촬영에 실패했습니다. 다시 시도하세요."); }
  procBusy = false;
  renderThumbs();
};

function renderThumbs() {
  $("thumbs").innerHTML = staged.map((s, i) => '<img data-i="' + i + '" src="' + s.thumb + '" alt="">').join("");
  $("save").disabled = staged.length < 1;
  $("save").textContent = staged.length ? "이 사람 저장 (얼굴 " + staged.length + "개)" : "이 사람 저장";
}
$("thumbs").onclick = e => {
  const i = e.target.dataset && e.target.dataset.i;
  if (i !== undefined) { staged.splice(+i, 1); renderThumbs(); }
};
$("reset").onclick = () => { staged = []; $("prog").textContent = ""; renderThumbs(); };

$("save").onclick = () => {
  const name = $("regName").value.trim();
  if (!name) { alert("이름을 입력하세요."); return; }
  if (!db[name] && Object.keys(db).length >= MAX_PEOPLE) { alert("최대 " + MAX_PEOPLE + "명까지 등록할 수 있습니다."); return; }
  const merged = (db[name] || []).concat(staged.map(s => s.desc.map(v => +v.toFixed(4))));
  db[name] = merged.slice(-MAX_PER);
  save(); staged = []; $("prog").textContent = ""; $("regName").value = "";
  renderThumbs(); renderPeople();
  alert(name + " 저장 완료");
};

// ---- 목록 ----
function renderPeople() {
  const names = Object.keys(db);
  $("regCount").textContent = "등록 " + names.length + " / " + MAX_PEOPLE + "명";
  $("people").innerHTML = names.length ? names.map(n =>
    '<div class="item"><span>' + esc(n) + ' <span class="small">(' + db[n].length + '장)</span></span>' +
    '<button data-del="' + esc(n) + '">삭제</button></div>').join("")
    : '<div class="mute">등록된 사람이 없습니다.</div>';
}
$("people").onclick = e => {
  const n = e.target.dataset.del;
  if (n && confirm(n + " 삭제할까요?")) { delete db[n]; save(); renderPeople(); }
};
$("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], { type: "application/json" }));
  a.download = "faces.json"; a.click();
};
$("import").onclick = () => $("file").click();
$("file").onchange = async e => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    let skipped = 0;
    Object.entries(data).forEach(([n, list]) => {
      const ok = Array.isArray(list) && list.every(d => Array.isArray(d) && d.length === 128);
      if (!ok) return;
      if (!db[n] && Object.keys(db).length >= MAX_PEOPLE) { skipped++; return; }
      db[n] = list.slice(-MAX_PER);
    });
    save(); renderPeople();
    if (skipped) alert(skipped + "명은 " + MAX_PEOPLE + "명 제한으로 가져오지 못했습니다.");
  } catch (_) { alert("올바른 파일이 아닙니다."); }
  e.target.value = "";
};

// 일치 기준
$("thr").value = thr;
const showThr = () => $("thrTxt").textContent = "현재 " + thr.toFixed(2) + " · 낮을수록 엄격(오인식↓, 놓침↑), 높을수록 느슨. 기본 0.50";
$("thr").oninput = e => { thr = parseFloat(e.target.value); localStorage.setItem(KEY_THR, thr); showThr(); };
showThr();

// ---- UI ----
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === b.dataset.t));
});
$("flip").onclick = async () => { facing = facing === "user" ? "environment" : "user"; await startCam(); };

renderPeople(); renderThumbs(); init();
</script>
</body>
</html>
