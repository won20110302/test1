<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>얼굴 인식</title>
<style>
  :root {
    --bg: #eef1f4; --card: #ffffff; --ink: #172033; --sub: #5b667a;
    --line: #d9dee6; --ok: #0f9d58; --no: #d93025; --accent: #1f4fd8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
  body { padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 24px); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 14px 0 10px; }
  .cam { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; }
  .cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam video { transform: scaleX(-1); }
  .cam.back video { transform: none; }
  #status { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff;
    font-size: 12px; padding: 4px 8px; border-radius: 6px; }
  #flip { position: absolute; right: 8px; top: 8px; background: rgba(0,0,0,.55); color: #fff;
    border: 0; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin: 12px 0; }
  .tabs button { flex: 1; padding: 11px 0; border: 1px solid var(--line); background: var(--card);
    border-radius: 10px; font-size: 14px; color: var(--sub); }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .panel.on { display: block; }
  .name { font-size: 26px; font-weight: 700; }
  .pct { font-size: 40px; font-weight: 700; line-height: 1.1; }
  .verdict { font-size: 14px; font-weight: 600; }
  .ok { color: var(--ok); } .no { color: var(--no); } .mute { color: var(--sub); }
  .bar { height: 8px; background: #e6eaf0; border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
  .row { display: flex; justify-content: space-between; font-size: 14px; }
  .small { font-size: 12px; color: var(--sub); }
  h2 { font-size: 14px; margin: 16px 0 6px; }
  input[type=text] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .btn { width: 100%; padding: 13px; font-size: 15px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; margin-top: 8px; }
  .btn.alt { background: #e6eaf0; color: var(--ink); }
  .btn:disabled { opacity: .4; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .item button { border: 0; background: none; color: var(--no); font-size: 14px; }
  .log { font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<h1>얼굴 인식</h1>

<div class="cam" id="cam">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <button id="flip">카메라 전환</button>
  <div id="status">모델 불러오는 중…</div>
</div>

<div class="tabs">
  <button data-t="rec" class="on">인식</button>
  <button data-t="reg">등록</button>
  <button data-t="list">목록</button>
</div>

<!-- 인식 -->
<div class="panel on" id="rec">
  <div id="resEmpty" class="mute">카메라에 얼굴을 비춰주세요.</div>
  <div id="resBox" style="display:none">
    <div class="name" id="rName">-</div>
    <div class="pct" id="rPct">0%</div>
    <div class="verdict" id="rVerdict"></div>
    <div class="bar"><i id="rBar"></i></div>
    <div class="small" id="rDist"></div>
    <h2>후보 순위</h2>
    <div id="cands"></div>
  </div>
  <h2>인식 기록</h2>
  <div id="log"><div class="small">아직 기록이 없습니다.</div></div>
</div>

<!-- 등록 -->
<div class="panel" id="reg">
  <input type="text" id="regName" placeholder="이름 입력" maxlength="20">
  <button class="btn" id="shot">현재 얼굴 촬영 (0/5)</button>
  <button class="btn alt" id="save" disabled>이 사람 저장 (3장 이상)</button>
  <button class="btn alt" id="reset">촬영 초기화</button>
  <div class="small" style="margin-top:10px">정면, 좌우로 살짝 돌린 각도, 안경 유무 등 조금씩 다르게 3~5장 찍으면 인식률이 올라갑니다. 한 화면에 한 명만 나오게 하세요.</div>
</div>

<!-- 목록 -->
<div class="panel" id="list">
  <div id="people"></div>
  <button class="btn alt" id="export">데이터 내보내기 (JSON)</button>
  <button class="btn alt" id="import">데이터 가져오기</button>
  <input type="file" id="file" accept="application/json" style="display:none">
  <div class="small" style="margin-top:10px">데이터는 이 휴대폰 브라우저에만 저장됩니다. 브라우저 데이터를 지우거나 시크릿 모드를 쓰면 사라집니다.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/";
const KEY = "faces_v1";
const MATCH_DIST = 0.5;   // 이 거리 미만이면 일치 (작을수록 엄격)
const $ = id => document.getElementById(id);

const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
let db = JSON.parse(localStorage.getItem(KEY) || "{}");   // { 이름: [descriptor, ...] }
let facing = "user", stream = null, busy = false, lastFaces = [];
let shots = [], lastLogName = null;

const save = () => localStorage.setItem(KEY, JSON.stringify(db));

// 거리 → 일치율(%): 거리 0.5에서 50%, 가까울수록 100%에 접근
const toPct = d => 100 / (1 + Math.exp(10 * (d - MATCH_DIST)));

function rank(desc) {
  return Object.entries(db).map(([name, list]) => {
    const d = Math.min(...list.map(x => faceapi.euclideanDistance(desc, x)));
    return { name, d, pct: toPct(d) };
  }).sort((a, b) => a.d - b.d);
}

async function startCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
    });
  } catch (e) {
    $("status").textContent = "카메라 권한을 허용하고 HTTPS 주소로 접속하세요";
    return;
  }
  video.srcObject = stream;
  await video.play();
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  $("cam").style.aspectRatio = video.videoWidth + "/" + video.videoHeight;
  $("cam").classList.toggle("back", facing !== "user");
  $("status").textContent = "인식 중";
}

async function init() {
  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
    ]);
  } catch (e) {
    $("status").textContent = "모델 로드 실패: 인터넷 연결을 확인하세요";
    return;
  }
  await startCam();
  loop();
}

const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 });

async function loop() {
  if (!busy && video.readyState >= 2 && video.videoWidth) {
    busy = true;
    try {
      const dets = await faceapi.detectAllFaces(video, opts).withFaceLandmarks().withFaceDescriptors();
      lastFaces = dets;
      render(dets);
    } catch (e) { /* 다음 프레임에서 재시도 */ }
    busy = false;
  }
  setTimeout(loop, 120);
}

function render(dets) {
  const W = overlay.width, H = overlay.height;
  ctx.clearRect(0, 0, W, H);
  const mirror = facing === "user";
  let biggest = null, biggestRank = null, area = 0;

  dets.forEach(det => {
    const b = det.detection.box;
    const ranks = Object.keys(db).length ? rank(det.descriptor) : [];
    const top = ranks[0];
    const matched = top && top.d < MATCH_DIST;
    const x = mirror ? W - b.x - b.width : b.x;
    const color = matched ? "#0f9d58" : "#d93025";
    ctx.lineWidth = Math.max(2, W / 200);
    ctx.strokeStyle = color;
    ctx.strokeRect(x, b.y, b.width, b.height);
    const label = top ? (matched ? top.name : "알 수 없음") + " " + Math.round(top.pct) + "%" : "얼굴";
    ctx.font = "bold " + Math.round(W / 26) + "px sans-serif";
    const tw = ctx.measureText(label).width + 10, th = Math.round(W / 22);
    ctx.fillStyle = color;
    ctx.fillRect(x, Math.max(0, b.y - th), tw, th);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, x + 5, Math.max(th - 6, b.y - 6));
    if (b.width * b.height > area) { area = b.width * b.height; biggest = det; biggestRank = ranks; }
  });

  if (!biggest) {
    $("resEmpty").style.display = ""; $("resBox").style.display = "none";
    return;
  }
  $("resEmpty").style.display = "none"; $("resBox").style.display = "";
  if (!biggestRank.length) {
    $("rName").textContent = "등록된 얼굴 없음";
    $("rPct").textContent = "-"; $("rVerdict").textContent = "";
    $("rBar").style.width = "0"; $("rDist").textContent = "";
    $("cands").innerHTML = "";
    return;
  }
  const top = biggestRank[0], ok = top.d < MATCH_DIST;
  $("rName").textContent = ok ? top.name : "알 수 없음";
  $("rPct").textContent = top.pct.toFixed(1) + "%";
  $("rVerdict").textContent = ok ? "일치" : "불일치";
  $("rVerdict").className = "verdict " + (ok ? "ok" : "no");
  $("rBar").style.width = top.pct + "%";
  $("rDist").textContent = "가장 가까운 등록자: " + top.name + " / 거리 " + top.d.toFixed(3) + " (기준 " + MATCH_DIST + " 미만이면 일치)";
  $("cands").innerHTML = biggestRank.slice(0, 3).map(r =>
    '<div class="row"><span>' + esc(r.name) + '</span><span>' + r.pct.toFixed(1) + '%</span></div>' +
    '<div class="bar"><i style="width:' + r.pct + '%"></i></div>').join("");

  const key = ok ? top.name : "알 수 없음";
  if (key !== lastLogName) { lastLogName = key; addLog(key, top.pct); }
}

function addLog(name, pct) {
  const box = $("log");
  if (box.querySelector(".small")) box.innerHTML = "";
  const t = new Date().toLocaleTimeString("ko-KR", { hour12: false });
  const el = document.createElement("div");
  el.className = "log";
  el.innerHTML = "<span>" + esc(name) + " (" + pct.toFixed(1) + "%)</span><span class='mute'>" + t + "</span>";
  box.prepend(el);
  while (box.children.length > 8) box.lastChild.remove();
}

const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- 등록 ----
function updateShotUI() {
  $("shot").textContent = "현재 얼굴 촬영 (" + shots.length + "/5)";
  $("shot").disabled = shots.length >= 5;
  $("save").disabled = shots.length < 3;
}
$("shot").onclick = () => {
  if (lastFaces.length !== 1) { alert("화면에 얼굴이 정확히 1명 보여야 합니다."); return; }
  shots.push(Array.from(lastFaces[0].descriptor));
  updateShotUI();
};
$("reset").onclick = () => { shots = []; updateShotUI(); };
$("save").onclick = () => {
  const name = $("regName").value.trim();
  if (!name) { alert("이름을 입력하세요."); return; }
  db[name] = (db[name] || []).concat(shots);
  save(); shots = []; updateShotUI(); $("regName").value = "";
  renderPeople(); lastLogName = null;
  alert(name + " 저장 완료");
};

// ---- 목록 ----
function renderPeople() {
  const names = Object.keys(db);
  $("people").innerHTML = names.length ? names.map(n =>
    '<div class="item"><span>' + esc(n) + ' <span class="small">(' + db[n].length + '장)</span></span>' +
    '<button data-del="' + esc(n) + '">삭제</button></div>').join("")
    : '<div class="mute">등록된 사람이 없습니다.</div>';
}
$("people").onclick = e => {
  const n = e.target.dataset.del;
  if (n && confirm(n + " 삭제할까요?")) { delete db[n]; save(); renderPeople(); }
};
$("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], { type: "application/json" }));
  a.download = "faces.json"; a.click();
};
$("import").onclick = () => $("file").click();
$("file").onchange = async e => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    db = Object.assign(db, data); save(); renderPeople();
  } catch (_) { alert("올바른 파일이 아닙니다."); }
};

// ---- UI ----
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === b.dataset.t));
});
$("flip").onclick = async () => { facing = facing === "user" ? "environment" : "user"; await startCam(); };

renderPeople(); updateShotUI(); init();
</script>
</body>
</html>
